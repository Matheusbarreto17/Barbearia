<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Barbearia — Servicos')}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="skin-bright">

  <div th:replace="~{fragments/nav :: nav}"></div>

  <section class="container py-4">

    <!-- Cabeçalho + ações -->
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
      <h1 class="h4 m-0">Servicos</h1>

      <div class="d-flex align-items-center gap-2 ms-md-auto">
        <form class="d-none d-md-block" th:action="@{/servicos}" method="get" role="search">
          <div class="input-group">
            <input class="form-control" type="search" name="q" placeholder="Pesquisar servico…" th:value="${param.q}">
            <button class="btn btn-outline-danger" type="submit"><i class="bi bi-search"></i></button>
          </div>
        </form>

        <a class="btn btn-danger" th:href="@{/servicos/cadastro}">
          <i class="bi bi-plus-lg me-1"></i> Novo servico
        </a>
      </div>
    </div>

    <div class="card kpi-card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Servico</th>
                <th class="d-none d-md-table-cell">Descrição</th>
                <th class="d-none d-md-table-cell">Duração</th>
                <th class="d-none d-md-table-cell">Preço</th>
                <th class="d-none d-lg-table-cell">Criado por</th>
                <th class="d-none d-lg-table-cell">Criado em</th>
                <th class="d-none d-lg-table-cell">Atualizado por</th>
                <th class="d-none d-lg-table-cell">Atualizado em</th>
                <th class="text-center">Ativo</th>
                <th class="text-end" style="width:160px">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="b : ${servicoList}">
                <td>
                  <div class="d-flex align-items-center gap-2">
                    <!-- Foto: se houver foto, usa a THUMB; senão, placeholder -->
                    <img th:if="${b.foto != null and !#strings.isEmpty(b.foto)}"
                         class="rounded-circle object-fit-cover flex-shrink-0"
                         style="width:40px; height:40px;"
                         th:src="@{/{p}(p=${#strings.replace(b.foto, 'main.jpg', 'thumb.jpg')})}"
                         alt="foto">

                    <img th:unless="${b.foto != null and !#strings.isEmpty(b.foto)}"
                         class="rounded-circle object-fit-cover flex-shrink-0"
                         style="width:40px; height:40px;"
                         src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2740%27 height=%2740%27%3E%3Crect width=%2740%27 height=%2740%27 fill=%27%23f1f3f5%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 fill=%27%236c757d%27 font-size=%2710%27%3Eimg%3C/text%3E%3C/svg%3E"
                         alt="foto">

                    <div class="lh-sm">
                      <div class="fw-semibold" th:text="${#strings.isEmpty(b.name) ? '—' : b.name}">Nome</div>
                      <small class="text-muted" th:text="${b.id}">uuid</small>
                    </div>
                  </div>
                </td>
				<td class="d-none d-md-table-cell" th:text="${#strings.isEmpty(b.descricao) ? '—' : b.descricao}">—</td>
				<td class="d-none d-md-table-cell" th:text="${#strings.isEmpty(b.duracao) ? '—' : b.duracao}">—</td>
                <td class="d-none d-md-table-cell" th:text="${#strings.isEmpty(b.preco) ? '—' : b.preco}">—</td>

                <td class="d-none d-lg-table-cell" th:text="${b.createdBy} ?: '—'">admin</td>
                <td class="d-none d-lg-table-cell" th:text="${b.createdAt != null ? #temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
                <td class="d-none d-lg-table-cell" th:text="${b.updatedBy} ?: '—'">admin</td>
                <td class="d-none d-lg-table-cell" th:text="${b.updatedAt != null ? #temporals.format(b.updatedAt, 'dd/MM/yyyy HH:mm') : '—'}">—</td>

                <td class="text-center">
                  <i class="bi"
                     th:classappend="${b.ativo} ? 'bi-check-circle-fill text-success' : 'bi-x-circle-fill text-secondary'"></i>
                </td>

                <td class="text-end">
                  <div class="btn-group">
                    <a class="btn btn-sm btn-outline-danger"
                       th:href="@{/servicos/editar/{id}(id=${b.id})}"
                       title="Editar">
                      <i class="bi bi-pencil-square"></i>
                    </a>

                    <form th:action="@{/servicos/delete/{id}(id=${b.id})}"
                          th:method="delete" class="d-inline"
                          onsubmit="return confirm('Confirmar exclusão do servico?');">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir">
                        <i class="bi bi-trash"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>

              <tr th:if="${#lists.isEmpty(servicoList)}">
                <td colspan="9" class="text-center text-muted py-5">
                  <i class="bi bi-inbox me-2"></i> Nenhum servico encontrado.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Busca (mobile) -->
    <form class="mt-3 d-md-none" th:action="@{/servicos}" method="get" role="search">
      <div class="input-group">
        <input class="form-control" type="search" name="q" placeholder="Pesquisar servico…" th:value="${param.q}">
        <button class="btn btn-outline-danger" type="submit"><i class="bi bi-search"></i></button>
      </div>
    </form>

  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
