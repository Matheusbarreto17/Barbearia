<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Nova Role — Administração')}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="skin-bright">

  <div th:replace="~{fragments/nav :: nav}"></div>

  <section class="container py-4">

    <!-- Cabeçalho + ações -->
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
      <div class="d-flex align-items-center gap-2">
        <div class="hero-avatar"><i class="bi bi-person-plus"></i></div>
        <div>
          <h1 class="h4 m-0">Nova Role</h1>
          <small class="text-muted">Preencha a role de acesso.</small>
        </div>
      </div>

      <div class="ms-md-auto">
        <a class="btn btn-outline-danger" th:href="@{/roles}">
          <i class="bi bi-arrow-left-short me-1"></i> Voltar
        </a>
      </div>
    </div>

    <!-- Formulário -->
   <form class="card kpi-card"
      th:action="${acao} == 'edicao' ? @{/roles/edicao} : @{/roles/add}"
      method="post"
      th:object="${role}"
      novalidate>
      
      <input type="hidden" th:if="${acao} == 'edicao'" th:field="*{id}"/>

  <div class="card-body p-4">

    <!-- Linha 1: Utilizador + Perfil -->
    <div class="row g-3 align-items-end">

      <div class="col-md-6">
        <label class="form-label fw-semibold" for="name">Nome</label>
        <input id="name" type="text" class="form-control"
               placeholder="ex.: joao.silva"
               th:field="*{name}" required>
        <small class="text-danger" th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}">Erro no utilizador</small>
      </div>
    </div>


    <!-- Linha 3: Ativo + Aviso -->
    <div class="row g-3 mt-1 align-items-center">
      <div class="col-md-3">
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
          <label class="form-check-label" for="ativo">Ativo</label>
        </div>
      </div>
      <div class="col-md-9">
        <div class="alert alert-light border mb-0 py-2">
          <i class="bi bi-info-circle me-1"></i>
          Os campos de auditoria (<code>createdBy/createdAt</code>, <code>updatedBy/updatedAt</code>)
          serão preenchidos automaticamente.
        </div>
      </div>
    </div>

  </div>

  <div class="card-footer d-flex justify-content-end gap-2">
    <a class="btn btn-outline-danger" th:href="@{/roles}">
      Cancelar
    </a>
    <button type="submit" class="btn btn-danger">
      <i class="bi bi-check2-circle me-1"></i> Guardar
    </button>
  </div>

  <!-- CSRF -->
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>


  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
