<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Novo Cliente — Administração')}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="skin-bright">

  <div th:replace="~{fragments/nav :: nav}"></div>

  <section class="container py-4">

    <!-- Cabeçalho + ações -->
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
      <div class="d-flex align-items-center gap-2">
        <div class="hero-avatar"><i class="bi bi-person-plus"></i></div>
        <div>
          <h1 class="h4 m-0">Novo cliente</h1>
          <small class="text-muted">Preencha os dados do cliente.</small>
        </div>
      </div>

      <div class="ms-md-auto">
        <a class="btn btn-outline-danger" th:href="@{/clientes}">
          <i class="bi bi-arrow-left-short me-1"></i> Voltar
        </a>
      </div>
    </div>

    <!-- Formulário -->
   <form class="card kpi-card"
      th:action="${acao} == 'edicao' ? @{/clientes/edicao} : @{/clientes/add}"
      method="post"
      th:object="${cliente}"
      novalidate>
      
      <input type="hidden" th:if="${acao} == 'edicao'" th:field="*{id}"/>

  <div class="card-body p-4">

    <!-- Linha 1: Utilizador + Perfil -->
    <div class="row g-3 align-items-end">
      <div class="col-md-6">
        <label class="form-label fw-semibold" for="nome">Nome</label>
        <input id="nome" type="text" class="form-control"
               placeholder="ex.: joao.silva"
               th:field="*{nome}" required>
        <small class="text-danger" th:if="${#fields.hasErrors('nome')}"
               th:errors="*{nome}">Erro no utilizador</small>
      </div>
      
	<div class="col-md-6">
  		<label class="form-label fw-semibold" for="dataNascimento">Data de Nascimento</label>

  		<input id="dataNascimento"
         type="date"
         class="form-control"
         th:field="*{dataNascimento}"
         required
         th:attr="max=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />

  		<small class="text-danger"
         th:if="${#fields.hasErrors('dataNascimento')}"
         th:errors="*{dataNascimento}">
 		 </small>
	</div>

      
          <div class="col-md-6">
        <label class="form-label fw-semibold" for="telefone">Telefone</label>
        <input id="telefone" type="text" class="form-control"
               placeholder="ex.9999-9999: "
               th:field="*{telefone}" required>
        <small class="text-danger" th:if="${#fields.hasErrors('telefone')}"
               th:errors="*{telefone}">Erro no telefone</small>
      </div>
      
         <div class="col-md-6">
        <label class="form-label fw-semibold" for="email">Email</label>
        <input id="email" type="text" class="form-control"
               placeholder="ex. cliente@...."
               th:field="*{email}" required>
        <small class="text-danger" th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}">Erro no email</small>
      </div>
      
      
    <!-- Supondo que seu <form> tenha th:object="${cliente}" (ou entidade equivalente) -->
<div class="col-md-6">
  <label class="form-label fw-semibold" for="genero">Gênero</label>

  <select id="genero" class="form-select" th:field="*{genero}" required>
    <!-- Placeholder aparece apenas quando o campo está vazio -->
<!--     <option th:value="" th:if="*{genero} == null" selected disabled>Selecione…</option> -->

    <!-- Carrega todas as opções do enum -->
    <option th:each="g : ${T(com.wmdigital.barbearia.util.Genero).values()}"
            th:value="${g}"
            th:text="${g.rotulo}">
      Gênero
    </option>
  </select>

  <small class="text-danger"
         th:if="${#fields.hasErrors('genero')}"
         th:text="${#fields.errors('genero')[0]}">
  </small>
</div>
    
      
            <div class="col-md-6">
        <label class="form-label fw-semibold" for="usuario">Usuario</label>
        <select id="genero" class="form-select" th:field="*{usuario.id}" required>
          <option value="" disabled selected>Selecione…</option>
          <option th:each="r : ${usuarios}" th:value="${r.id}" th:text="${r.username}">Usuario</option>
        </select>
<!--         <small class="text-danger" -->
<!--                th:if="${#fields.hasErrors('role') || #fields.hasErrors('genero')}" -->
<!--                th:text="${#fields.hasErrors('role.id') ? #fields.errors('genero')[0] : (#fields.errors('genero')[0])}"> -->
<!--           Selecione um genero -->
<!--         </small> -->
      </div>
    </div>

    <!-- Linha 3: Ativo + Aviso -->
    <div class="row g-3 mt-1 align-items-center">
      <div class="col-md-3">
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
          <label class="form-check-label" for="ativo">Ativo</label>
        </div>
      </div>
      <div class="col-md-9">
        <div class="alert alert-light border mb-0 py-2">
          <i class="bi bi-info-circle me-1"></i>
          Os campos de auditoria (<code>createdBy/createdAt</code>, <code>updatedBy/updatedAt</code>)
          serão preenchidos automaticamente.
        </div>
      </div>
    </div>

  </div>

  <div class="card-footer d-flex justify-content-end gap-2">
    <a class="btn btn-outline-danger" th:href="@{/clientes}">
      Cancelar
    </a>
    <button type="submit" class="btn btn-danger">
      <i class="bi bi-check2-circle me-1"></i> Guardar
    </button>
  </div>

  <!-- CSRF -->
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>


  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
