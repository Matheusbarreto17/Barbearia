<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Novo Agendamento — Administração')}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="skin-bright">

  <div th:replace="~{fragments/nav :: nav}"></div>

  <section class="container py-4">

    <!-- Cabeçalho + ações -->
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
      <div class="d-flex align-items-center gap-2">
        <div class="hero-avatar"><i class="bi bi-person-plus"></i></div>
        <div>
          <h1 class="h4 m-0">Novo agendamento</h1>
          <small class="text-muted">Preencha os dados do agendamento.</small>
        </div>
      </div>

      <div class="ms-md-auto">
        <a class="btn btn-outline-danger" th:href="@{/agendamentos}">
          <i class="bi bi-arrow-left-short me-1"></i> Voltar
        </a>
      </div>
    </div>

    <!-- Formulário -->
   <form class="card kpi-card"
      th:action="${acao} == 'edicao' ? @{/agendamentos/edicao} : @{/agendamentos/add}"
      method="post"
      th:object="${agendamento}"
      novalidate>
      
      <input type="hidden" th:if="${acao} == 'edicao'" th:field="*{id}"/>

  <div class="card-body p-4">

    <!-- Linha 1: Utilizador + Perfil -->
    <div class="row g-3 align-items-end">

	          <div class="col-md-6">
        <label class="form-label fw-semibold" for="cliente">Cliente</label>
        <select id="cliente" class="form-select" th:field="*{cliente.id}" required>
          <option value="" disabled selected>Selecione…</option>
          <option th:each="r : ${clientes}" th:value="${r.id}" th:text="${r.nome}">Cliente</option>
        </select>
      </div>
      
      <div class="col-md-6">
        <label class="form-label fw-semibold" for="servico">Servico</label>
        <select id="servico" class="form-select" th:field="*{servico.id}" required>
          <option value="" disabled selected>Selecione…</option>
          <option th:each="r : ${servicos}" th:value="${r.id}" th:text="${r.name}">Servico</option>
        </select>
      </div>
      
         <div class="col-md-6">
        <label class="form-label fw-semibold" for="barbeiro">Barbeiro</label>
        <select id="barbeiro" class="form-select" th:field="*{barbeiro.id}" required>
          <option value="" disabled selected>Selecione…</option>
          <option th:each="r : ${barbeiros}" th:value="${r.id}" th:text="${r.nome}">Barbeiro</option>
        </select>
      </div>
      
	<div class="col-md-6">
  		<label class="form-label fw-semibold" for="inicio">Inicio</label>

  		<input id="inicio"
         type="datetime-local"
         class="form-control"
         th:field="*{inicio}"
         required
         th:attr="max=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />

  		<small class="text-danger"
         th:if="${#fields.hasErrors('inicio')}"
         th:errors="*{inicio}">
 		 </small>
	</div>
	
	<div class="col-md-6">
  		<label class="form-label fw-semibold" for="fim">Fim</label>

  		<input id="fim"
         type="datetime-local"
         class="form-control"
         th:field="*{fim}"
         required
         th:attr="max=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />

  		<small class="text-danger"
         th:if="${#fields.hasErrors('fim')}"
         th:errors="*{fim}">
 		 </small>
	</div>

      
    <!-- Supondo que seu <form> tenha th:object="${agendamento}" (ou entidade equivalente) -->
<div class="col-md-6">
  <label class="form-label fw-semibold" for="status">Status</label>

  <select id="status" class="form-select" th:field="*{status}" required>
    <!-- Placeholder aparece apenas quando o campo está vazio -->
<!--     <option th:value="" th:if="*{genero} == null" selected disabled>Selecione…</option> -->

    <!-- Carrega todas as opções do enum -->
    <option th:each="g : ${T(com.wmdigital.barbearia.util.Status).values()}"
            th:value="${g}"
            th:text="${g.status}">
      Status
    </option>
  </select>

  <small class="text-danger"
         th:if="${#fields.hasErrors('status')}"
         th:text="${#fields.errors('status')[0]}">
  </small>
</div>
    
      
  
    </div>

    <!-- Linha 3: Ativo + Aviso -->
    <div class="row g-3 mt-1 align-items-center">
      <div class="col-md-3">
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
          <label class="form-check-label" for="ativo">Ativo</label>
        </div>
      </div>
      <div class="col-md-9">
        <div class="alert alert-light border mb-0 py-2">
          <i class="bi bi-info-circle me-1"></i>
          Os campos de auditoria (<code>createdBy/createdAt</code>, <code>updatedBy/updatedAt</code>)
          serão preenchidos automaticamente.
        </div>
      </div>
    </div>

  </div>

  <div class="card-footer d-flex justify-content-end gap-2">
    <a class="btn btn-outline-danger" th:href="@{/agendamentos}">
      Cancelar
    </a>
    <button type="submit" class="btn btn-danger">
      <i class="bi bi-check2-circle me-1"></i> Guardar
    </button>
  </div>

  <!-- CSRF -->
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>


  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
