<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Barbearia — Início')}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="skin-bright">

  <div th:replace="~{fragments/nav :: nav}"></div>

  <section class="container py-4">
    <h1 class="h4 mb-3"><i class="bi bi-calendar2-check"></i> Agendar</h1>

    <!-- Indicador de passos -->
    <div class="wizard-steps mb-4">
      <div class="wizard-step active" data-step="1"><span class="num">1</span> Serviço</div>
      <div class="wizard-step" data-step="2"><span class="num">2</span> Barbeiro</div>
      <div class="wizard-step" data-step="3"><span class="num">3</span> Dia & Hora</div>
      <div class="wizard-step" data-step="4"><span class="num">4</span> Seus dados</div>
    </div>

    <!-- Form único para enviar tudo no final -->
    <form id="wizForm" method="post" th:action="@{/agendamentos/agendar}">
      <!-- campos finais -->
      <input type="hidden" name="servicoId" id="servicoId">
      <input type="hidden" name="barbeiroId" id="barbeiroId">
      <input type="hidden" name="inicio" id="inicioIso">

      <!-- Step 1: Serviço -->
      <div class="step-pane active" data-step="1">
        <h2 class="h5 mb-3">Escolha o serviço</h2>
        <div class="row g-3" id="lista-servicos"></div>
        <div class="d-flex justify-content-end mt-3">
          <button type="button" class="btn btn-primary" id="toStep2" disabled>Continuar</button>
        </div>
      </div>

      <!-- Step 2: Barbeiro -->
      <div class="step-pane" data-step="2">
        <h2 class="h5 mb-3">Escolha o barbeiro</h2>
        <div class="row g-3" id="lista-barbeiros"></div>
        <div class="d-flex justify-content-between mt-3">
          <button type="button" class="btn btn-outline-secondary" data-back>Voltar</button>
          <button type="button" class="btn btn-primary" id="toStep3" disabled>Continuar</button>
        </div>
      </div>

      <!-- Step 3: Dia & Hora -->
      <div class="step-pane" data-step="3">
        <h2 class="h5 mb-3">Escolha o dia e a hora</h2>
        <div class="row g-2 align-items-end">
          <div class="col-12 col-sm-6 col-md-4">
            <label class="form-label">Dia</label>
            <input type="date" class="form-control" id="diaInput" min="" required>
          </div>
          <div class="col-12 col-md">
            <button type="button" class="btn btn-outline-primary" id="btnCarregarSlots">
              <i class="bi bi-arrow-clockwise"></i> Ver horários disponíveis
            </button>
          </div>
        </div>
        <div class="mt-3" id="slotsContainer"></div>
        <div class="d-flex justify-content-between mt-3">
          <button type="button" class="btn btn-outline-secondary" data-back>Voltar</button>
          <button type="button" class="btn btn-primary" id="toStep4" disabled>Continuar</button>
        </div>
      </div>

      <!-- Step 4: Dados do cliente -->
      <div class="step-pane" data-step="4">
        <h2 class="h5 mb-3">Seus dados</h2>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nome</label>
            <input class="form-control" name="clienteNome" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="clienteEmail" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Telefone</label>
            <input class="form-control" name="clienteTelefone" required>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="politica" required>
              <label class="form-check-label" for="politica">
                Concordo com a política de privacidade e termos de uso.
              </label>
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-between mt-3">
          <button type="button" class="btn btn-outline-secondary" data-back>Voltar</button>
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check2-circle"></i> Confirmar agendamento
          </button>
        </div>
      </div>
    </form>
  </section>
  
  <style>
    .wizard-steps {display:flex;gap:.75rem;flex-wrap:wrap}
    .wizard-step{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-radius:.75rem;border:1px solid #e5e7eb}
    .wizard-step.active{border-color:#0d6efd;background:#f0f6ff}
    .wizard-step .num{width:1.75rem;height:1.75rem;display:inline-grid;place-items:center;border-radius:999px;background:#e9ecef}
    .wizard-step.active .num{background:#0d6efd;color:#fff}
    .step-pane{display:none}
    .step-pane.active{display:block}
  </style>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script>
  (function () {
	  // util
	  const sel = (q, root = document) => root.querySelector(q);
	  const selAll = (q, root = document) => Array.from(root.querySelectorAll(q));

	  const steps = selAll('.wizard-step');
	  const panes = selAll('.step-pane');
	  let selectedServico = null;
	  let selectedBarbeiro = null;
	  let selectedInicioIso = null;
	  const inputServicoId = sel('#servicoId');
	  const inputBarbeiroId = sel('#barbeiroId');
	  const inputInicioIso = sel('#inicioIso');

	  function go(step) {
	    steps.forEach(s => s.classList.toggle('active', s.dataset.step == step));
	    panes.forEach(p => p.classList.toggle('active', p.dataset.step == step));
	    window.scrollTo({ top: 0, behavior: 'smooth' });
	  }

	  selAll('[data-back]').forEach(btn =>
	    btn.addEventListener('click', () => {
	      const pane = btn.closest('.step-pane');
	      const step = parseInt(pane.dataset.step, 10);
	      go(step - 1);
	    })
	  );

	  // Carregar serviços
	  async function loadServicos() {
	    const wrap = sel('#lista-servicos');
	    wrap.innerHTML = '<div class="text-muted">Carregando serviços…</div>';
	    const r = await fetch('/agendamentos/api/servicos');
	    const data = await r.json(); // [{id,nome,preco,duracaoMin}]
	    wrap.innerHTML = '';
	    data.forEach(s => {
	      const col = document.createElement('div');
	      col.className = 'col-12 col-md-6 col-lg-4';
	      col.innerHTML = `
	        <div class="card h-100 selectable" data-id="${s.id}">
	          <div class="card-body">
	            <h5 class="card-title mb-1">${s.nome}</h5>
	            <div class="small text-muted">Duração: ${s.duracaoMin || 30} min</div>
	            ${s.preco != null ? `<div class="mt-2 fw-semibold">€ ${Number(s.preco).toFixed(2)}</div>` : ``}
	          </div>
	        </div>`;
	      wrap.appendChild(col);
	    });

	    function selectCard(containerId, onSelect) {
	      selAll(`#${containerId} .card`).forEach(c => {
	        c.addEventListener('click', () => {
	          selAll(`#${containerId} .card`).forEach(x =>
	            x.classList.remove('border-primary', 'shadow')
	          );
	          c.classList.add('border-primary', 'shadow');
	          onSelect(c.dataset.id);
	        });
	      });
	    }

	    selectCard('lista-servicos', id => {
	      selectedServico = id;
	      inputServicoId.value = id;
	      sel('#toStep2').disabled = false;
	    });
	  }

	  // Avançar para passo 2
	  sel('#toStep2').addEventListener('click', async () => {
	    if (!selectedServico) return;
	    await loadBarbeiros();
	    go(2);
	  });

	  // Carregar barbeiros
	  async function loadBarbeiros() {
	    const wrap = sel('#lista-barbeiros');
	    wrap.innerHTML = '<div class="text-muted">Carregando barbeiros…</div>';
	    const r = await fetch('/agendamentos/api/barbeiros?servicoId=' + encodeURIComponent(selectedServico));
	    const data = await r.json(); // [{id,nome,foto?}]
	    wrap.innerHTML = '';
	    data.forEach(b => {
	      const col = document.createElement('div');
	      col.className = 'col-12 col-md-6 col-lg-4';
	      col.innerHTML = `
	        <div class="card h-100 selectable" data-id="${b.id}">
	          <div class="card-body d-flex align-items-center gap-3">
	            <div class="hero-avatar"><i class="bi bi-scissors"></i></div>
	            <div>
	              <h5 class="card-title mb-1">${b.nome}</h5>
	              <div class="small text-muted">Selecione para ver horários</div>
	            </div>
	          </div>
	        </div>`;
	      wrap.appendChild(col);
	    });

	    selAll('#lista-barbeiros .card').forEach(c => {
	      c.addEventListener('click', () => {
	        selAll('#lista-barbeiros .card').forEach(x =>
	          x.classList.remove('border-primary', 'shadow')
	        );
	        c.classList.add('border-primary', 'shadow');
	        selectedBarbeiro = c.dataset.id;
	        inputBarbeiroId.value = selectedBarbeiro;
	        sel('#toStep3').disabled = false;
	      });
	    });
	  }

	  // Avançar para passo 3
	  sel('#toStep3').addEventListener('click', () => {
	    const d = new Date();
	    const iso = d.toISOString().slice(0, 10);
	    const diaInput = sel('#diaInput');
	    if (!diaInput.value) diaInput.value = iso;
	    diaInput.min = iso;
	    sel('#slotsContainer').innerHTML = '';
	    sel('#toStep4').disabled = true;
	    go(3);
	  });

	  // Carregar slots
	  sel('#btnCarregarSlots').addEventListener('click', async () => {
	    const dia = sel('#diaInput').value;
	    if (!dia || !selectedBarbeiro || !selectedServico) return;

	    const wrap = sel('#slotsContainer');
	    wrap.innerHTML = '<div class="text-muted">Carregando horários…</div>';

	    const params = new URLSearchParams({
	      barbeiroId: selectedBarbeiro,
	      servicoId: selectedServico,
	      day: dia
	    });
	    const r = await fetch('/agendamentos/api/slots?' + params.toString());
	    const data = await r.json(); // [{inicioIso,fimIso,rotulo}]
	    wrap.innerHTML = '';

	    if (!data.length) {
	      wrap.innerHTML =
	        '<div class="alert alert-warning">Sem horários disponíveis para este dia.</div>';
	      return;
	    }

	    const grid = document.createElement('div');
	    grid.className = 'd-flex flex-wrap gap-2';
	    data.forEach(s => {
	      const btn = document.createElement('button');
	      btn.type = 'button';
	      btn.className = 'btn btn-outline-secondary';
	      btn.textContent =
	        s.rotulo ||
	        new Date(s.inicioIso).toLocaleTimeString([], {
	          hour: '2-digit',
	          minute: '2-digit'
	        });
	      btn.addEventListener('click', () => {
	        selAll('#slotsContainer .btn').forEach(x =>
	          x.classList.remove('btn-primary')
	        );
	        btn.classList.add('btn-primary');
	        selectedInicioIso = s.inicioIso;
	        inputInicioIso.value = selectedInicioIso;
	        sel('#toStep4').disabled = false;
	      });
	      grid.appendChild(btn);
	    });
	    wrap.appendChild(grid);
	  });

	  // Avançar passo 4
	  sel('#toStep4').addEventListener('click', () => {
	    if (!selectedInicioIso) return;
	    go(4);
	  });

	  // init
	  loadServicos();
	})();

  </script>

</body>
</html>
