<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Barbearia— movimentacaoagendamento')}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="skin-bright">


  <div th:replace="~{fragments/nav :: nav}"></div>

<section class="container py-4">

    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
      <h1 class="h4 m-0">Agendamentos</h1>

      <div class="d-flex align-items-center gap-2 ms-md-auto">
        <form class="d-none d-md-block" th:action="@{/agendamentos}" method="get" role="search">
          <div class="input-group">
            <input class="form-control" type="search" name="q" placeholder="Pesquisar usuário…" th:value="${param.q}">
            <button class="btn btn-outline-danger" type="submit"><i class="bi bi-search"></i></button>
          </div>
        </form>

        <a class="btn btn-danger" th:href="@{/agendamentos/cadastro}">
          <i class="bi bi-plus-lg me-1"></i> Novo agendamento
        </a>
      </div>
    </div>

    <div class="card kpi-card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Agendamento</th>
                <th>Cliente</th>
                <th>Serviço</th>
                <th>Barbeiro</th>
                <th>Inicio</th>
                <th>Fim</th>
                <th>Duração</th>
                
                <!-- auditoria (escondidas no mobile) -->
                <th class="d-none d-lg-table-cell">Criado por</th>
                <th class="d-none d-lg-table-cell">Criado em</th>
                <th class="d-none d-lg-table-cell">Atualizado por</th>
                <th class="d-none d-lg-table-cell">Atualizado em</th>
                <th class="text-center">Ativo</th>
                <th class="text-end" style="width:160px">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u : ${agendamentoList}">
                <td>
                  <div class="d-flex align-items-center gap-2">
                    <div class="hero-avatar flex-shrink-0"><i class="bi bi-person"></i></div>
                    <div class="lh-sm">
<!--                       <div class="fw-semibold" th:text="${u.nome}">john</div> -->
                      <small class="text-muted" th:text="${u.id}">uuid</small>
                    </div>
                  </div>
                </td>
                
                <td class="d-none d-lg-table-cell" th:text="${u.cliente.nome} ?: '—'">-</td>
                <td class="d-none d-lg-table-cell" th:text="${u.servico.name} ?: '—'">-</td>
                <td class="d-none d-lg-table-cell" th:text="${u.barbeiro.nome} ?: '—'">-</td>
                  <td class="d-none d-lg-table-cell">
                  <span th:text="${u.inicio != null ? #temporals.format(u.inicio, 'dd/MM/yyyy HH:mm') : '—'}">-</span>
                </td>
                  <td class="d-none d-lg-table-cell">
                  <span th:text="${u.fim != null ? #temporals.format(u.fim, 'dd/MM/yyyy HH:mm') : '—'}">-</span>
                </td>
                 <td class="d-none d-lg-table-cell" th:text="${u.servico.duracao != null} ? ${u.servico.duracao} + ' min' : '—'"></td>
             
                <!-- Auditoria -->
                <td class="d-none d-lg-table-cell" th:text="${u.createdBy} ?: '—'">admin</td>
                <td class="d-none d-lg-table-cell">
                  <span th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">01/08/2025 10:00</span>
                </td>
                <td class="d-none d-lg-table-cell" th:text="${u.updatedBy} ?: '—'">admin</td>
                <td class="d-none d-lg-table-cell">
                  <span th:text="${u.updatedAt != null ? #temporals.format(u.updatedAt, 'dd/MM/yyyy HH:mm') : '—'}">05/08/2025 17:42</span>
                </td>
                
               <td class="text-center">
                  <i class="bi"
                     th:classappend="${u.ativo} ? 'bi-check-circle-fill text-success' : 'bi-x-circle-fill text-secondary'"></i>
                </td>

                <td class="text-end">
                  <div class="btn-group">
                    <a class="btn btn-sm btn-outline-danger"
                       th:href="@{/agendamentos/editar/{id}(id=${u.id})}"
                       title="Editar">
                      <i class="bi bi-pencil-square"></i>
                    </a>

                    <form th:action="@{/agendamentos/delete/{id}(id=${u.id})}"
                          th:method="delete" class="d-inline"
                          onsubmit="return confirm('Confirmar exclusão do agendamento?');">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir">
                        <i class="bi bi-trash"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>

              <tr th:if="${#lists.isEmpty(agendamentoList)}">
                <td colspan="8" class="text-center text-muted py-5">
                  <i class="bi bi-inbox me-2"></i> Nenhum agendamento encontrado.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Busca (mobile) -->
    <form class="mt-3 d-md-none" th:action="@{/agendamentos}" method="get" role="search">
      <div class="input-group">
        <input class="form-control" type="search" name="q" placeholder="Pesquisar agendamento" th:value="${param.q}">
        <button class="btn btn-outline-danger" type="submit"><i class="bi bi-search"></i></button>
      </div>
    </form>

  </section>
  <div th:replace="~{fragments/footer :: footer}"></div>

  
</body>
</html>
