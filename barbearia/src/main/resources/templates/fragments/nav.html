<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt">
<th:block th:fragment="nav">
  <nav class="navbar navbar-expand-lg nav-glass nav-red sticky-top border-bottom">
    <div class="container">

      <!-- LOGO + MARCA -->
      <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
        <img th:src="@{/img/logo/logo-mark.png}" alt="Barbearia" class="brand-logo" width="36" height="36"
             style="object-fit:contain; border-radius:.35rem;">
        <span class="fw-bold brand-name--red">Barbearia</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"><div></div></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 main-links">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#servicos">Serviços</a></li>
          <li class="nav-item"><a class="nav-link" href="#barbeiros">Barbeiros</a></li>
          <li class="nav-item"><a class="nav-link" href="#depoimentos">Depoimentos</a></li>
          <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
        </ul>

        <!-- Visitante -->
        <ul class="navbar-nav ms-auto align-items-center" sec:authorize="!isAuthenticated()">
          <li class="nav-item me-2">
            <a class="btn btn-outline-dark btn-sm" th:href="@{/login}">
              <i class="bi bi-box-arrow-in-right"></i> Entrar
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-danger btn-sm" th:href="@{/agendar}">
              <i class="bi bi-calendar2-check"></i> Agendar
            </a>
          </li>
        </ul>

        <!-- Logado -->
        <ul class="navbar-nav ms-auto align-items-center gap-2" sec:authorize="isAuthenticated()">
          <li class="nav-item d-none d-lg-block text-secondary small me-2">
            <i class="bi bi-person-circle"></i>
            <span class="ms-1" sec:authentication="name">user</span>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-dark btn-sm" th:href="@{/dashboard}">
              <i class="bi bi-speedometer2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-danger btn-sm" th:href="@{/agendar}">
              <i class="bi bi-calendar2-check"></i> Agendar
            </a>
          </li>
          <li class="nav-item">
            <form th:action="@{/logout}" method="post" class="d-inline">
              <button type="submit" class="btn btn-ghost-light btn-sm">
                <i class="bi bi-box-arrow-right"></i> Sair
              </button>
            </form>
          </li>
        </ul>
      </div>

    </div>
  </nav>
</th:block>
</html>
