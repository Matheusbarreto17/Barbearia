<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Barbearia— Início')}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="skin-bright">

  <div th:replace="~{fragments/nav :: nav}"></div>

<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">
    <h3 class="text-center mb-4">Redefinir Senha</h3>

    <form th:action="@{/resetar-senha}" method="post">
      <!-- alerta de erro -->
      <div th:if="${erro}" class="alert alert-danger text-center" th:text="${erro}"></div>

      <!-- token oculto -->
      <input type="hidden" name="token" th:value="${token}">

      <!-- campo nova senha -->
      <div class="mb-3">
        <label class="form-label">Nova senha</label>
        <input class="form-control" name="senha" type="password" placeholder="Digite sua nova senha" required>
      </div>

      <!-- campo confirmar senha -->
      <div class="mb-3">
        <label class="form-label">Confirmar senha</label>
        <input class="form-control" name="confirma" type="password" placeholder="Repita a nova senha" required>
      </div>

      <!-- botão -->
      <div class="d-grid">
        <button class="btn btn-danger" type="submit">Salvar</button>
      </div>
    </form>
  </div>
</div>
</br>
</br>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
