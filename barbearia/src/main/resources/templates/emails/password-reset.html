<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
  <body style="font-family:Arial,sans-serif">
    <h2>Redefinir senha</h2>
    <p>Olá <b th:text="${nome}">cliente</b>, recebemos seu pedido para redefinir a senha.</p>
    <p>
      Clique no botão abaixo (o link expira em <span th:text="${expiraMin}">60</span> minutos):
    </p>
    <p>
      <a th:href="${restUrl}"
         style="background:#d32f2f;color:#fff;padding:10px 16px;text-decoration:none;border-radius:6px;">
        Redefinir senha
      </a>
    </p>
    <p>Se não foi você, ignore este e-mail.</p>
  </body>
</html>
